name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure build/node images
        run: ./scripts/ci-ensure.sh --push

      - name: Build liboyoltc bundle
        run: ./scripts/04-build-liboyoltc.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: oyo-web/go.mod
          cache: false

      - name: Install e2e deps
        working-directory: oyo-web/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The release gate: the full dev suite (go tests + Playwright e2e
      # against the exact litecoind that ships) must be green.
      - name: Tests (go + Playwright e2e)
        run: OYO_SKIP_DEPLOY=1 ./oyo-web/oyo-dev.sh quick

      - name: Build portable oyo-web
        run: ./scripts/05-build-oyo-web.sh

      - name: Package release archive
        run: ./scripts/07-package.sh "$GITHUB_REF_NAME"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --title "$GITHUB_REF_NAME" \
            dist/out/*.tar.gz dist/out/*.tar.gz.sha256
